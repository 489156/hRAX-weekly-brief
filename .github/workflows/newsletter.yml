name: 랙스 주제별 주간 발행
on:
  schedule:
    # UTC 01:17 = 한국시간 10:17. 화요일 시작, 수·목요일 미발행 주제만 재시도.
    # 정시 시작·완료는 보장되지 않으며 비활동 공개 저장소는 예약이 비활성화될 수 있다.
    - cron: '17 1 * * 2,3,4'
  workflow_dispatch:
    inputs:
      verify_only:
        description: '연결만 확인하고 수집·AI·게시는 요청하지 않음'
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: hrax-weekly-publication
  cancel-in-progress: false
jobs:
  publish:
    # 공개·기본 브랜치·명시적 허용을 모두 확인한다. 공개 사이트 별도 승인 전에는 false를 유지한다.
    if: >-
      github.event.repository.private == false && github.ref == 'refs/heads/main' &&
      (vars.PUBLICATION_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.verify_only))
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/run-weekly.mjs
          sparse-checkout-cone-mode: false
      - name: 원문 확인과 주제별 게시
        env:
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only && 'true' || 'false' }}
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        # 기본 제공 Node의 fetch만 사용한다. 설치·캐시·빌드 산출물 업로드 없음.
        run: node scripts/run-weekly.mjs
